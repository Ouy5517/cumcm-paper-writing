name: cumcm-paper-writing
version: 0.5.0
description: >
  Declarative routing for source-grounded, contest-aware modeling paper
  planning, drafting, rendering, review, and submission preflight.

always_load:
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/output-format.md

axes:
  contest:
    detect: Select the named contest; unknown contests use generic. The actual year is case metadata, not a global CUMCM selector.
    values:
      generic: references/contest-profile.md
      cumcm: references/contest-profile.md
      mcm-icm: references/contest-profile.md
      course: references/contest-profile.md
    default: generic
    multi: false
  task:
    detect: |
      Choose one or more modes from plan, draft-section, draft-paper,
      restructure, audit, preflight, and submission-package. Use preflight
      whenever the user asks whether a paper is ready to submit.
    values:
      plan: static/fragments/task/plan.md
      draft-section: static/fragments/task/draft-section.md
      draft-paper: static/fragments/task/draft-paper.md
      restructure: static/fragments/task/restructure.md
      audit: static/fragments/task/audit.md
      preflight: static/fragments/task/preflight.md
      submission-package: static/fragments/task/submission-package.md
    default: plan
    multi: true

  delivery:
    detect: |
      Detect whether the author needs Markdown/LaTeX source, a rendered DOCX
      or PDF, a physical-paper package, an electronic package, or both.
    values:
      source: static/fragments/delivery/source.md
      rendered: static/fragments/delivery/rendered.md
      electronic: static/fragments/delivery/electronic.md
      physical: static/fragments/delivery/physical.md
      both: static/fragments/delivery/both.md
    default: source
    multi: true

  language:
    detect: |
      Default to Chinese for a Chinese request. Preserve mathematical symbols,
      variable names, and standard English method names when they are canonical.
    values:
      zh: static/fragments/language/zh.md
      en: static/fragments/language/en.md
    default: zh
    multi: false

references:
  on_demand:
    - condition: drafting or auditing a complete competition solution
      path: references/problem-coverage.md
    - condition: formulating or validating descriptive, predictive, optimization or simulation models
      path: references/model-validation.md
    - condition: generating or revising manuscript, figures, code and submission artifacts
      path: references/artifact-consistency.md
    - condition: including or shortening code appendices
      path: references/code-appendix.md
    - condition: a PDF must be generated with LaTeX, formulas render incorrectly, or a reproducible XeLaTeX build and support package is required
      path: references/latex-production-workflow.md
    - condition: a CUMCMThesis/cumcmthesis class, style, example, or local template folder is supplied
      path: references/cumcmthesis-template.md
    - condition: CUMCM only and historical rule pointers are needed; verify original sources before enforcement
      path: references/requirements.md
    - condition: planning or drafting a full paper structure
      path: references/paper-structure.md
    - condition: claim/evidence provenance, citation, or reproducibility is uncertain
      path: references/evidence-ledger.md
    - condition: final PDF/Word or archive submission readiness is being checked
      path: references/preflight.md
    - condition: CUMCM only and verified Chinese declaration wording is needed
      path: references/chinese-quick-reference.md

name: cumcm-paper-writing
version: 2.0.0
description: >
  Declarative CUMCM-only routing for Chinese paper planning, drafting,
  revision, validation, rendering, and submission packaging.

always_load:
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/output-format.md
  - static/core/reader-contract.md
  - static/core/terminology-notation-ledger.md

axes:
  task:
    detect: |
      Choose one or more modes from plan, draft-section, draft-paper, polish,
      restructure, audit, preflight, and submission-package. Use preflight
      whenever the user asks whether a paper is ready to submit.
    values:
      plan: static/fragments/task/plan.md
      draft-section: static/fragments/task/draft-section.md
      draft-paper: static/fragments/task/draft-paper.md
      polish: static/fragments/task/polish.md
      restructure: static/fragments/task/restructure.md
      audit: static/fragments/task/audit.md
      preflight: static/fragments/task/preflight.md
      submission-package: static/fragments/task/submission-package.md
    default: plan
    multi: true

  delivery:
    detect: |
      Detect whether the author needs Markdown/LaTeX source, a rendered DOCX
      or PDF, a physical-paper package, an electronic package, or both.
    values:
      source: static/fragments/delivery/source.md
      rendered: static/fragments/delivery/rendered.md
      electronic: static/fragments/delivery/electronic.md
      physical: static/fragments/delivery/physical.md
      both: static/fragments/delivery/both.md
    default: source
    multi: true

  section:
    detect: |
      Detect one or more requested paper sections. For a full paper, load the
      requested section fragments in argument order; do not load every section
      merely because one section is named.
    values:
      abstract: static/fragments/section/abstract.md
      problem-analysis: static/fragments/section/problem-analysis.md
      assumptions-notation: static/fragments/section/assumptions-notation.md
      model-formulation: static/fragments/section/model-formulation.md
      solution-results: static/fragments/section/solution-results.md
      validation-sensitivity: static/fragments/section/validation-sensitivity.md
      model-evaluation: static/fragments/section/model-evaluation.md
      conclusion: static/fragments/section/conclusion.md
      references: static/fragments/section/references.md
      appendix: static/fragments/section/appendix.md
    multi: true

  model_family:
    detect: |
      Detect one or more model families actually used: evaluation, prediction,
      optimization, mechanistic, simulation, or hybrid. A hybrid also requires
      its component families.
    values:
      evaluation: static/fragments/model_family/evaluation.md
      prediction: static/fragments/model_family/prediction.md
      optimization: static/fragments/model_family/optimization.md
      mechanistic: static/fragments/model_family/mechanistic.md
      simulation: static/fragments/model_family/simulation.md
      hybrid: static/fragments/model_family/hybrid.md
    multi: true

references:
  on_demand:
    - condition: drafting or auditing a complete CUMCM solution
      path: references/problem-coverage.md
    - condition: formulating or validating evaluation, prediction, optimization,
        mechanistic, simulation, or hybrid models
      path: references/model-validation.md
    - condition: generating or revising manuscript, figures, code and submission artifacts
      path: references/artifact-consistency.md
    - condition: including or shortening code appendices
      path: references/code-appendix.md
    - condition: a PDF must be generated with LaTeX, formulas render incorrectly, or a reproducible XeLaTeX build and support package is required
      path: references/latex-production-workflow.md
    - condition: a CUMCMThesis/cumcmthesis class, style, example, or local template folder is supplied
      path: references/cumcmthesis-template.md
    - condition: historical rule pointers are needed; verify original sources before enforcement
      path: references/requirements.md
    - condition: planning or drafting a full paper structure
      path: references/paper-structure.md
    - condition: results, full-paper drafting, compression, result placement, or repeated tables require evidence allocation
      path: references/main-text-discipline.md
    - condition: full-paper or multi-round consistency review, or abstract/body/conclusion disagreement
      path: references/consistency-sweep.md
    - condition: layout/typesetting, table walls, sparse pages, stranded headings, float, or overflow problems
      path: references/layout-diagnosis.md
    - condition: claim/evidence provenance, citation, or reproducibility is uncertain
      path: references/evidence-ledger.md
    - condition: final PDF/Word or archive submission readiness is being checked
      path: references/preflight.md
    - condition: practical FAQ questions concern preflight, validation, appendix versus support package, or submission requirements
      path: references/cumcm-practical-faq.md
    - condition: verified Chinese declaration wording is needed
      path: references/chinese-quick-reference.md
